; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = megaatmega2560

[env:megaatmega2560]
platform = atmelavr@5.3.0
board = megaatmega2560
framework = arduino
monitor_speed = 9600
extra_scripts =
	pre:tools/generate_config.py
	pre:tools/check_build.py
; Match the already verified toolchain and dependencies, not moving ranges.
platform_packages =
	platformio/framework-arduino-avr@5.4.0
	platformio/toolchain-atmelavr@1.70300.191015
; tcMenu / IoAbstraction headers contain intentional unused callback parameters.
; Keep other project warnings fatal without modifying upstream library files.
build_src_flags = -Wall -Wextra -Werror -Wno-unused-parameter
lib_deps = 
	tcmenu/tcMenu@4.5.9
	tcmenu/LiquidCrystalIO@1.4.3
	tcmenu/tcUnicodeHelper@1.2.3
	tcmenu/SimpleCollections@1.2.5
	tcmenu/TaskManagerIO@1.5.4
	tcmenu/IoAbstraction@4.5.3
	tcmenu/TcMenuLog@5.0.0
	fastled/FastLED@3.10.5
