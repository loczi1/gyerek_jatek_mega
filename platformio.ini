[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
lib_deps = 
	tcmenu/tcMenu@^4.4.0
	tcmenu/LiquidCrystalIO@^1.4.3
	tcmenu/tcUnicodeHelper@^1.2.1
	tcmenu/SimpleCollections@^1.2.5
	tcmenu/TaskManagerIO@^1.5.2
	tcmenu/IoAbstraction@^4.4.0
	marcoschwartz/LiquidCrystal_I2C@^1.1.4
	fastled/FastLED@^3.10.3
